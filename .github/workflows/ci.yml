name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No team repository is checked out here: the build falls back to the bundled SDK version,
      # and SimulatorProtocolTest starts the simulator without one.
      - name: Unit and protocol tests
        run: ./gradlew test --console=plain

      - name: Web syntax
        run: node tools/check-web.mjs

      - name: Documentation references
        run: node tools/docs-check.mjs --check
